[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "venv", ".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = [
    "S101",  # assert used (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"scripts/generate_secrets.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["auth", "gateway", "middleware", "security", "monitoring", "deployment", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
